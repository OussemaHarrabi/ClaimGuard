# ---------------------------------------------------------------------------
# ClaimGuard AI — local / demo stack
#
#   cp .env.example .env                       # once (compose reads it below)
#   docker compose up -d --build               # db + migrate + api  (the demo)
#   docker compose up -d db otel-lgtm          # infra only (fast daily loop;
#                                              #   then run the API on the host:
#                                              #   `uv run claimguard serve --reload`)
#   docker compose --profile temporal up -d    # ...plus Temporal (opt-in)
#
# What `docker compose up -d --build` gives you, in order:
#   db       PostgreSQL 16, healthy
#   migrate  one-shot `alembic upgrade head` against that database
#   api      the reviewer API on http://localhost:8000
#            OpenAPI docs        /docs
#            readiness           /v1/health
#   web      the Next.js evidence-first reviewer workspace on
#            http://localhost:3001 (3000 remains Grafana in this stack)
#
# The legacy `/review` page stays available as an operational fallback. The
# primary reviewer experience is the separately built Next.js `web` service,
# which proxies `/v1/*` to `api` without exposing a second API contract.
#
# Windows note: keep API hot-reload on the host (Docker file sharing slows
# watch loops); Compose is for the demo / production-shaped run.
# ---------------------------------------------------------------------------
name: claimguard

services:
  # --- PostgreSQL 16: claims data + append-only audit log ------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-claimguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-claimguard}
      POSTGRES_DB: ${POSTGRES_DB:-claimguard}
    ports:
      - "5432:5432"
    volumes:
      # Named volume so data survives `docker compose down`.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-claimguard} -d ${POSTGRES_DB:-claimguard}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # --- One-shot schema migration -------------------------------------------
  # The API reports 503 with the fix-it command when the review tables are
  # missing, so the demo stack applies them itself and exits. `api` waits for
  # this to complete, which is why `docker compose up` lands on a working API
  # instead of a healthy-looking one that answers 503.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      CLAIMGUARD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-claimguard}:${POSTGRES_PASSWORD:-claimguard}@db:5432/${POSTGRES_DB:-claimguard}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # --- OpenTelemetry backend: single-container Grafana + Loki + Mimir + Tempo
  # Grafana UI on :3000 (default admin/admin), OTLP/HTTP receiver on :4318.
  # Available for when an exporter is wired: no code constructs one today, so
  # nothing is exported yet and the app runs identically without this service.
  otel-lgtm:
    image: grafana/otel-lgtm:0.32.1
    ports:
      - "3000:3000"
      - "4318:4318"
    volumes:
      - lgtm_data:/data
    restart: unless-stopped

  # --- The application: review API + reviewer interface ---------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Container-to-container overrides: host values from `.env` would point
      # the container at itself instead of at the `db` service.
      CLAIMGUARD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-claimguard}:${POSTGRES_PASSWORD:-claimguard}@db:5432/${POSTGRES_DB:-claimguard}
      # The rule catalogue. The mentor pack is gitignored reference data, so the
      # container mounts the vendored, committed copy of its `rules/` catalogue
      # (tests/edu/fixtures/pack_reference) instead of depending on a directory
      # that a fresh clone does not have. To validate against the full pack,
      # replace this mount with the pack's `rules/` directory.
      CLAIMGUARD_RULES_DIR: /catalogue
    volumes:
      - ./tests/edu/fixtures/pack_reference:/catalogue:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      # The endpoint always answers 200 so operators can inspect a degraded
      # deployment. Container readiness therefore parses the JSON verdict.
      test: ["CMD", "python", "-c", "import json,sys,urllib.request; body=json.load(urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)); sys.exit(0 if body.get('status') == 'ok' else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --- Evidence-first reviewer workspace (Next.js, standalone output) ------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        CLAIMGUARD_API_ORIGIN: http://api:8000
        NEXT_PUBLIC_DEMO_MODE: "false"
        NEXT_PUBLIC_REVIEWER_NAME: ${CLAIMGUARD_REVIEWER_NAME:-reviewer-12}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Optional profile: Temporal (durable workflows) — NOT started by default.
  # Nothing in the application enables it yet (no code reads
  # CLAIMGUARD_TEMPORAL_*); this profile is the infrastructure spike only.
  # Enable with: docker compose --profile temporal up -d
  # -------------------------------------------------------------------------
  temporal-postgresql:
    profiles: ["temporal"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    profiles: ["temporal"]
    image: temporalio/auto-setup:1.23.1.1
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      SERVICES: history,matching,worker,frontend
      LOG_LEVEL: warn
    ports:
      - "7233:7233"

  temporal-ui:
    profiles: ["temporal"]
    image: temporalio/ui:2.53.3
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8000
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  lgtm_data:
  temporal_postgres_data:
