  <text x="235" y="132" fill="#102B49" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="84" font-weight="750" letter-spacing="-3">Claim<tspan fill="#099EAA">Guard</tspan></text>
  <text x="241" y="172" fill="#597189" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" letter-spacing="5">EVIDENCE BEFORE SUBMISSION</text>
