      <stop offset="0" stop-color="#153B60"/>
      <stop offset="1" stop-color="#0E2744"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43D5CC"/>
      <stop offset="1" stop-color="#0EA7B1"/>
    </linearGradient>
  </defs>
