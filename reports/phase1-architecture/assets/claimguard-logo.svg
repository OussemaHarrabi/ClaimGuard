<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title description">
  <title id="title">ClaimGuard</title>
  <desc id="description">A shield formed around a verified claim line, followed by the ClaimGuard wordmark.</desc>
