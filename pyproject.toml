[project]
name = "claimguard"
version = "0.1.0"
description = "ClaimGuard AI — trustworthy agentic copilot for healthcare claim pre-validation (CSTAM-VELODOC)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary — CSTAM 3.0 / Velodoc challenge" }

# ---- Runtime (deliberately minimal; heavy deps are optional extras) ----
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.52",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "cel-python>=0.5",
    "jsonpointer>=3.0",
    "python-json-logger>=2.0",
    "structlog>=24.4",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "tenacity>=9.0",
    "orjson>=3.10",
]

[project.optional-dependencies]
# PII de-identification — heavy NLP deps, isolated so the API image stays lean.
pii = [
    "presidio-analyzer>=2.2.354",
    "presidio-anonymizer>=2.2.354",
]
# LLM layer — Pydantic AI is the typed agent library (see 04 §12).
llm = [
    "pydantic-ai>=0.1",
]
# Durable execution — Temporal thin workflows (see 09 §A2, ADR-010).
temporal = [
    "temporalio>=1.32.0",
]
# Evaluation: metrics, calibration, faithfulness.
eval = [
    "scikit-learn>=1.5",
    "numpy>=2.1",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.9",
    "pyright>=1.1.400",
    "pre-commit>=4.0",
    "hypothesis>=6.120",
]

[project.scripts]
claimguard = "claimguard.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claimguard"]

# ---------------------------------------------------------------------------
# ruff — lint + format, one tool (replaces flake8 + black + isort)
# Strictness is deliberate: this is a system where a silent failure is a defect.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["claimguard", "tests"]
exclude = [".venv", "web", "alembic_versions_archive"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort — import order
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear — likely bugs
    "A",      # builtin shadowing
    "C4",     # comprehensions
    "T20",    # print() is forbidden in library code — use structlog
    "SIM",    # simplify
    "RUF",    # ruff-specific rules
    "S",      # bandit — security
    "BLE",    # blind except: except Exception: pass hides failures
]
ignore = [
    "S101",   # assert is fine — pytest uses it
    "UP038",  # isinstance tuple syntax, slower on some versions
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "T20", "S105", "S106"]       # tests may assert/print/hardcode
"claimguard/cli/**" = ["T20"]                      # CLI may print to stdout

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# pyright — strict. A finding that cannot cite evidence must not compile clean.
# ---------------------------------------------------------------------------
[tool.pyright]
include = ["claimguard", "tests"]
exclude = ["**/__pycache__", "web", ".venv"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false      # many deps ship no stubs; don't fail the build
reportUnknownMemberType = true
reportUnknownVariableType = true
reportUnknownArgumentType = true
reportPrivateUsage = "warning"
reportUnnecessaryIsInstance = true
reportUnusedCallResult = false

# ---------------------------------------------------------------------------
# pytest — deterministic by default. Any test needing a live LLM is opt-in.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast, no I/O, no network",
    "integration: needs DB and/or Docker",
    "e2e: full stack, slow",
    "llm: calls a live LLM — excluded by default, runs nightly",
    "benchmark: evaluation harness runs",
]
filterwarnings = ["error", "ignore::DeprecationWarning:pkg_resources.*"]

[tool.coverage.run]
source = ["claimguard"]
branch = true
omit = ["claimguard/cli/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
