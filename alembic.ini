# ClaimGuard Alembic configuration.
#
# Migrations are raw SQL files under claimguard/db/migrations/versions/.
# Because Alembic discovers revisions only as Python modules, the environment
# script claimguard/db/migrations/env.py is the wiring that turns those files
# into Alembic-managed migrations: it reads each file's `revision` /
# `down_revision` header, applies pending files in dependency order inside one
# transaction and records them in alembic_version.

[alembic]
script_location = claimguard/db/migrations
prepend_sys_path = .
path_separator = os

# The database URL is intentionally NOT set here: env.py resolves it from
# claimguard.config.get_settings() (env var CLAIMGUARD_DATABASE_URL), falling
# back to a plain DATABASE_URL environment variable.
; sqlalchemy.url = postgresql+psycopg://user:pass@localhost:5432/claimguard

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S